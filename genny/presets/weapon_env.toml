schema = "genny.preset/1"
family = "weapon_env"
# Where a shot is heard (arms env=). Energies in dB re the direct sound at 10 m (they grow as r^2 with distance, +20 dB at most).
# boom_*: the low part (ground, terrain), boom_ms its 60 dB decay, boom_hz its low-pass.
# body_*: the early dense part (ground, terrain, nearby surfaces), body_ms its 60 dB decay, body_hz its low-pass.
# tail_*: the late field, tail_ms its build-up, t60 below 2 kHz, t60_hf above, tail_hz its low-pass.
# echoes: discrete reflections, ms after the direct sound, dB re the direct sound at 10 m, low-pass Hz.

[open_field]
body_db = 10.0
body_ms = 150.0
body_hz = 4000.0
boom_db = 12.0
boom_ms = 400.0
boom_hz = 250.0
tail_db = 8.0
tail_ms = 60.0
t60 = 1.3
t60_hf = 0.8
tail_hz = 6000.0
echoes = [{ ms = 150.0, db = -16.0, hz = 2500.0 }, { ms = 340.0, db = -21.0, hz = 1500.0 }, { ms = 610.0, db = -30.0, hz = 1000.0 }]

