[project]
name = "genny"
version = "1.0.1"
description = "Procedural and physically informed sound synthesis: DSP, modal bodies, waveguides, particles, fluids, voices, environments and acoustics."
readme = "README.md"
authors = [{ name = "blal1" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "numba>=0.59",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
]

[project.scripts]
genny = "genny.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genny"]
