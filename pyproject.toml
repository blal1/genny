[project]
name = "genny"
version = "1.2.1"
description = "Procedural and physically informed sound synthesis: DSP, modal bodies, waveguides, particles, fluids, voices, environments and acoustics."
readme = "README.md"
authors = [{ name = "blal1" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "numba>=0.59",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
# genny.calibrate.roughness (Daniel & Weber via MoSQITo; MoSQITo 1.2 imports matplotlib at load)
eval = ["mosqito>=1.2", "matplotlib"]

[project.scripts]
genny = "genny.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genny"]
